stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
    params:
      - data_ingestion
    outs:
      - data/interim/loan_data_cleaned.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/interim/loan_data_cleaned.csv
    params:
      - data_preprocessing
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/artifacts/encodings.json
      - models/artifacts/boxcox_lambdas.json

  feature_engineering:  # ← MISSING STAGE ADDED!
    cmd: python src/features/feature_engineering.py
    deps:
      - src/features/feature_engineering.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - feature_engineering
    outs:
      - data/features/train_features.csv
      - data/features/test_features.csv
      - models/artifacts/scaler.pkl
      - models/artifacts/selected_features.json

  model_training:
    cmd: python src/model/model_building.py
    deps:
      - src/model/model_building.py
      - data/features/train_features.csv      # ← FIXED!
      - data/features/test_features.csv       # ← FIXED!
    params:
      - model_building
    outs:
      - models/xgboost_model.pkl

  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
      - src/model/model_evaluation.py
      - data/features/test_features.csv       # ← FIXED!
      - models/xgboost_model.pkl
    params:
      - model_evaluation
      - model_building
    outs:
      - reports/metrics.json
      - reports/experiment_info.json

  model_registration:
    cmd: python src/model/model_registration.py
    deps:
      - src/model/model_registration.py
      - reports/experiment_info.json
