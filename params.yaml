data_ingestion:
  raw_data_file: "data/raw/loan_approval_data.csv"
  interim_data_path: "data/interim"
  drop_columns:
    - loan_id

data_preprocessing:
  interim_data_file: data/interim/loan_data_cleaned.csv
  processed_data_path: data/processed
  test_size: 0.2
  random_state: 42
  # Winsorization configuration
  winsorize_columns: ['cibil_score', 'residential_assets_value', 'commercial_assets_value', 'bank_asset_value']
  winsorize_limits_approved: [0.05, 0.1]
  winsorize_limits_rejected: [0.05, 0.1]
  # Box-Cox transformation (BEFORE split like notebook)
  boxcox_columns: ['loan_amount', 'residential_assets_value', 'commercial_assets_value', 'luxury_assets_value', 'bank_asset_value']
  # Asset aggregation (BEFORE split like notebook)
  asset_columns: ['residential_assets_value', 'commercial_assets_value', 'luxury_assets_value', 'bank_asset_value']

feature_engineering:
  train_file: data/processed/train.csv
  test_file: data/processed/test.csv
  output_path: data/features
  random_state: 42
  # SMOTE configuration
  apply_smote: true
  # Selected features (from notebook experimentation)
  selected_features: ['cibil_score', 'loan_term', 'loan_amount', 'total_assets', 'income_annum', 'employment_type_Salaried']
